services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: researchpilot
      POSTGRES_USER: researchpilot
      POSTGRES_PASSWORD: researchpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchpilot -d researchpilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://researchpilot:researchpilot@postgres:5432/researchpilot
      STORAGE_DIR: /data
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - ./storage:/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
